name: Daily standards discovery
on:
  schedule:
    - cron: '23 22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Evaluate, collect daily updates, or resume initial candidate discovery'
        type: choice
        options: [evaluate, daily, backfill]
        default: evaluate
      limit:
        description: 'Maximum documents for daily/backfill; blank defaults to 2000'
        type: string
        default: ''
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: standards-discovery
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FASTEMBED_CACHE_PATH: .cache/fastembed
      HF_HUB_DISABLE_TELEMETRY: '1'
      CLASSIFY_MODE: ${{ inputs.mode || 'daily' }}
      CLASSIFY_LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Restore pending generated data
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin standards/daily >/dev/null; then
            git fetch origin standards/daily
            if ! git merge-base --is-ancestor FETCH_HEAD HEAD; then
              for path in catalog/state.json catalog/candidates.json catalog/semantic-index.json reports/daily reports/semantic; do
                if git cat-file -e "FETCH_HEAD:$path" 2>/dev/null; then
                  git restore --source=FETCH_HEAD -- "$path"
                fi
              done
            fi
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: semantic/requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-${{ runner.os }}-${{ hashFiles('semantic/requirements.txt', 'semantic/config.json') }}
      - run: python -m pip install -r semantic/requirements.txt
      - run: python -m unittest discover -s semantic -p 'test_*.py'
      - run: npm test
      - run: npm run test:pkce
      - run: npm run test:merge-catalog
      - run: npm run test:pages
      - run: npm run collect
        if: env.CLASSIFY_MODE == 'daily'
      - name: Evaluate or discover candidates
        id: classify
        continue-on-error: true
        run: python semantic/pipeline.py --mode "$CLASSIFY_MODE" --limit "${CLASSIFY_LIMIT:-2000}"
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: discovery-checkpoint-${{ github.run_id }}
          path: |
            catalog/
            reports/daily/
            reports/semantic/
          if-no-files-found: ignore
      - uses: peter-evans/create-pull-request@v7
        id: catalog_pr
        with:
          branch: standards/daily
          base: main
          title: 'Update standards catalog and daily review queue'
          commit-message: 'Update standards catalog'
          body: 'Generated discovery data only. Semantic candidates are unreviewed and can be published automatically after validation. Confirmed/excluded decisions in catalog/reviewed.json and code/rules always require manual review.'
          add-paths: |
            catalog/state.json
            catalog/candidates.json
            catalog/semantic-index.json
            reports/daily/
            reports/semantic/
      - name: Validate and merge generated data
        if: github.ref == 'refs/heads/main' && steps.classify.outcome == 'success' && steps.catalog_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_PR_NUMBER: ${{ steps.catalog_pr.outputs.pull-request-number }}
        run: node scripts/merge-catalog.ts
      - name: Report discovery failure after preserving checkpoints
        if: steps.classify.outcome == 'failure'
        run: |
          echo 'CPU candidate discovery failed. Inspect the preceding step and reports/semantic; saved data has not been auto-merged.'
          exit 1
