name: Daily standards discovery
on:
  schedule:
    - cron: '23 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: standards-discovery
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      # Run current main code, carrying only unmerged catalog data forward.
      - name: Restore pending catalog changes
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin standards/daily >/dev/null; then
            git fetch origin standards/daily
            if ! git merge-base --is-ancestor FETCH_HEAD HEAD; then
              git restore --source=FETCH_HEAD -- catalog reports/daily
            fi
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Compact legacy data if present
        run: |
          if test -f catalog/state.json; then node collector/migrate.ts; fi
      - run: npm run collect
        env:
          CLASSIFIER_URL: ${{ vars.CLASSIFIER_URL }}
          CLASSIFIER_MODEL: ${{ vars.CLASSIFIER_MODEL }}
          CLASSIFIER_API_KEY: ${{ secrets.CLASSIFIER_API_KEY }}
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: standards/daily
          base: main
          title: 'Update standards catalog and daily review queue'
          commit-message: 'Update standards catalog'
          body: 'All-topic RFC and Internet-Draft discovery. Review catalog/related.json and compact daily summaries; pending decisions are retained in catalog/state.json. No generated protocol implementation is automatically merged.'
          add-paths: |
            catalog/
            reports/daily/
