name: Daily standards discovery
on:
  schedule:
    - cron: '23 22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Evaluate first; daily prioritizes updates; backfill resumes initial classification'
        type: choice
        options: [evaluate, daily, backfill]
        default: evaluate
      limit:
        description: 'Maximum documents (backfill default 500, daily default 30)'
        type: string
        default: ''
      max_usd:
        description: 'Cumulative reservation cap in USD, including past runs; blank uses repository variable or $0.10'
        type: string
        default: ''
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: standards-discovery
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CLASSIFY_MODE: ${{ inputs.mode || 'daily' }}
      CLASSIFY_LIMIT: ${{ inputs.limit }}
      CLASSIFIER_URL: ${{ vars.CLASSIFIER_URL }}
      CLASSIFIER_MODEL: ${{ vars.CLASSIFIER_MODEL }}
      CLASSIFIER_API_KEY: ${{ secrets.CLASSIFIER_API_KEY }}
      CLASSIFIER_INPUT_USD_PER_MILLION: ${{ vars.CLASSIFIER_INPUT_USD_PER_MILLION }}
      CLASSIFIER_OUTPUT_USD_PER_MILLION: ${{ vars.CLASSIFIER_OUTPUT_USD_PER_MILLION }}
      CLASSIFIER_MAX_USD: ${{ inputs.max_usd || vars.CLASSIFIER_MAX_USD || '0.10' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      # Run current main code, carrying only unmerged catalog data forward.
      - name: Restore pending catalog changes
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin standards/daily >/dev/null; then
            git fetch origin standards/daily
            if ! git merge-base --is-ancestor FETCH_HEAD HEAD; then
              git restore --source=FETCH_HEAD -- catalog reports
            fi
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Compact legacy data if present
        run: |
          if test -f catalog/state.json; then node collector/migrate.ts; fi
      - run: npm run collect
        if: env.CLASSIFY_MODE == 'daily'
      - name: Evaluate or classify
        id: classify
        continue-on-error: true
        run: |
          if test "$CLASSIFY_MODE" = evaluate; then
            npm run evaluate
          else
            npm run classify
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: classification-checkpoint-${{ github.run_id }}
          path: |
            catalog/
            reports/evaluation/
            reports/classification/
          if-no-files-found: ignore
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: standards/daily
          base: main
          title: 'Update standards catalog and daily review queue'
          commit-message: 'Update standards catalog'
          body: 'All-topic RFC and Internet-Draft discovery. Review catalog/related.json and compact daily summaries; pending decisions are retained in catalog/state.json. No generated protocol implementation is automatically merged.'
          add-paths: |
            catalog/
            reports/
      - name: Report model failure after preserving budget and completed batches
        if: steps.classify.outcome == 'failure'
        run: |
          if test "$CLASSIFY_MODE" = evaluate && test -f reports/evaluation/latest.json; then
            node --input-type=module - <<'JS'
          import {readFileSync, appendFileSync} from 'node:fs';
          const report = JSON.parse(readFileSync('reports/evaluation/latest.json', 'utf8'));
          const summary = JSON.stringify({status: report.status, error: report.error, metrics: report.metrics}, null, 2);
          console.error(summary);
          if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Evaluation failed\n\n\`\`\`json\n${summary}\n\`\`\`\n`);
          JS
          fi
          exit 1
