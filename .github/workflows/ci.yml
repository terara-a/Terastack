name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s semantic -p 'test_*.py'
      - run: npm ci
      - run: npm test
      - run: npm run test:pkce
      - run: npm run test:merge-catalog
      - name: Verify PKCE with workerd and SQLite Durable Objects
        env:
          WRANGLER_SEND_METRICS: false
        run: |
          npx wrangler dev --ip 127.0.0.1 --port 8787 > "$RUNNER_TEMP/pkce-workerd.log" 2>&1 &
          pkce_pid=$!
          trap 'kill "$pkce_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/health > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$pkce_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/pkce-workerd.log"
            exit 1
          fi
          node tests/workerd-smoke.mjs
      - run: npx wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: false
